name: Release build validation

# Validates a published release: the tag must match VERSION, and the full
# web bundle -> publish -> installer chain must compile. Fails fast on a tag
# mismatch so a release can never ship under a number the code does not carry
# (the v1.4.6 / v1.5.0 latest-badge mixup class of problem).
#
# This workflow does NOT attach the installer. As of spec 10024 (Open question 4,
# resolved local-only) the shipped installer is Authenticode-signed with Azure
# Artifact Signing, and no signing credential exists in GitHub, so CI could only
# ever produce an UNSIGNED build. Publishing that would defeat the signing work
# and silently hand users the warning-triggering binary. The installer here is
# compiled unsigned purely to prove the chain still builds, then discarded.
#
# The real release artifact comes from tools\build-signed-release.ps1 on JJ's
# machine, uploaded per spec\DEPLOY.md.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      # Tag arrives via env, not `${{ }}` interpolation into the script body:
      # release names are attacker-influencable text and interpolation splices
      # them straight into the shell.
      - name: Verify tag matches VERSION
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:RELEASE_TAG -ne "v$version") {
            Write-Error "Release tag '$($env:RELEASE_TAG)' does not match VERSION 'v$version'. Align them and re-release."
            exit 1
          }

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web\package-lock.json

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # Runs the SAME script the real release uses, with -SkipSigning. Re-listing
      # the publish arguments and the TFM path here would duplicate the release
      # chain, and a duplicate drifts silently: CI would go green while validating
      # a build that no longer matches what actually ships. -SkipSigning produces
      # WordMD-Setup-<version>-UNSIGNED.exe, which cannot be confused with a
      # releasable artifact and is never uploaded.
      - name: Validate release chain (unsigned)
        shell: pwsh
        run: .\tools\build-signed-release.ps1 -SkipSigning

      - name: Check the signed installer was attached
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Warns rather than fails: the release is already published by the time
          # this runs, so failing here would only add noise to a done deal.
          $names = @()
          try { $names = gh release view $env:RELEASE_TAG --json assets --jq '.assets[].name' } catch { }
          $signed = $names | Where-Object { $_ -like 'WordMD-Setup-*.exe' -and $_ -notlike '*-UNSIGNED*' }
          if ($signed) {
            Write-Host "Signed installer attached: $($signed -join ', ')"
          } else {
            Write-Warning "No signed installer on this release yet. Build and attach it locally: .\tools\build-signed-release.ps1"
          }
